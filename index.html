<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planet Parade Project</title>
  <!-- Link to external CSS stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🌌 Planet Parade 🚀</h1>
  <p class="intro">Explore four amazing planets from our solar system!</p>

  <!-- Grid Container holding all 4 planet cards -->
  <div class="planet-grid">

    <!-- Planet 1: Earth -->
    <figure class="planet-card">
      <img 
        src="https://images-assets.nasa.gov/image/PIA00114/PIA00114~thumb.jpg" 
        alt="Planet Earth viewed from space" 
        title="Planet Earth"
      >
      <figcaption>
        <h2>Earth</h2>
        <p>Earth is our home planet! It is the third planet from the Sun and the only place known to harbor life. It has liquid water oceans and an atmosphere rich in nitrogen and oxygen.</p>
      </figcaption>
    </figure>

    <!-- Planet 2: Mars -->
    <figure class="planet-card">
      <img 
        src="https://images-assets.nasa.gov/image/PIA00407/PIA00407~thumb.jpg" 
        alt="Red dusty surface of Mars" 
        title="Planet Mars"
      >
      <figcaption>
        <h2>Mars</h2>
        <p>Mars is known as the "Red Planet" due to iron oxide (rust) on its surface. It is a cold desert world with a very thin carbon dioxide atmosphere, giant volcanoes, and deep canyons.</p>
      </figcaption>
    </figure>

    <!-- Planet 3: Jupiter -->
    <figure class="planet-card">
      <img 
        src="https://images-assets.nasa.gov/image/PIA02242/PIA02242~thumb.jpg" 
        alt="Jupiter showing its Great Red Spot" 
        title="Planet Jupiter"
      >
      <figcaption>
        <h2>Jupiter</h2>
        <p>Jupiter is the largest planet in our solar system—more than 1,000 Earths could fit inside it! It is a gas giant made mostly of hydrogen and helium, featuring a giant storm called the Great Red Spot.</p>
      </figcaption>
    </figure>

    <!-- Planet 4: Saturn -->
    <figure class="planet-card">
      <img 
        src="https://images-assets.nasa.gov/image/PIA01364/PIA01364~thumb.jpg" 
        alt="Saturn with its prominent ring system" 
        title="Planet Saturn"
      >
      <figcaption>
        <h2>Saturn</h2>
        <p>Saturn is famous for its stunning, bright ring system made of ice and rock particles. Like Jupiter, it is a gas giant with dozens of icy moons and high-speed atmospheric winds.</p>
      </figcaption>
    </figure>

  </div>

</body>
</html>
